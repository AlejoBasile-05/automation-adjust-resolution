appId: com.alejoba.ajuste-resolucion
productName: Ajuste de Resolucion

directories:
  output: release

asar: true

# sharp and its libvips binaries are native: .node addons and .so files cannot
# be loaded from inside the asar archive, so they must live on disk.
asarUnpack:
  - '**/node_modules/sharp/**'
  - '**/node_modules/@img/**'
  - '**/node_modules/@tensorflow/**'
  - '**/node_modules/@tensorflow-models/**'

# sharp 0.35 is N-API based and ships prebuilt binaries; rebuilding against
# Electron's ABI is unnecessary and would require a native toolchain.
npmRebuild: false

# Disable auto-publishing in CI (we only want artifacts, not GitHub Releases)
publish: null

files:
  - '**/*'
  - '!**/test/**'
  - '!**/*.test.js'
  - '!odd/**'
  - '!release/**'
  - '!coverage/**'
  - '!frontend/**'
  - '!desktop/**/*.md'

extraResources:
  - from: frontend/dist
    to: frontend/dist

linux:
  target:
    - AppImage
    - dir
    - tar.gz
  category: Graphics
  executableName: ajuste-de-resolucion
  syncDesktopName: true
  artifactName: ${productName}-${version}-${arch}.${ext}

win:
  target:
    - portable
  artifactName: ${productName}-${version}-${arch}.exe

mac:
  target:
    - dmg
    - zip
  category: public.app-category.graphics-design
